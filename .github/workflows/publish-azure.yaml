name: Publish Frontend to Azure ACR

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish frontend image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ca7e04894508acr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          push: true
          tags: |
            ca7e04894508acr.azurecr.io/albumapp-ui:latest
            ca7e04894508acr.azurecr.io/albumapp-ui:${{ github.sha }}

  deploy:
    name: Deploy frontend to Azure Container Apps
    runs-on: ubuntu-latest
    needs: publish

    steps:
      # The template lives in the deployment repo, which owns all IaC.
      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          repository: JacobusTheOne/album-app-deployment
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deployment

      - name: Login to Azure using deployment identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ui.bicep takes only the image tag: it derives the API's internal URL
      # from the environment, so the frontend deploys without knowing which
      # API image is live.
      - name: Deploy frontend with Bicep
        run: |
          az deployment group create \
            --resource-group rg-azure-container-apps-dev \
            --template-file deployment/infra/ui.bicep \
            --parameters uiImageTag='${{ github.sha }}'

      # az deployment needs no extension, but az containerapp does.
      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade

      - name: Verify deployment
        run: |
          az containerapp show \
            --name album-ui \
            --resource-group rg-azure-container-apps-dev \
            --query "{image:properties.template.containers[0].image,latestRevision:properties.latestRevisionName,fqdn:properties.configuration.ingress.fqdn}" \
            --output table
      # Verify that the frontend can retrieve and render actual album data.
      - name: Smoke test frontend
        env:
          FQDN: ${{ steps.verify.outputs.fqdn }}
        run: |
          if [ -z "$FQDN" ]; then
            echo "Smoke test failed: frontend FQDN is empty."
            exit 1
          fi

          echo "Testing frontend: https://${FQDN}"

          for attempt in {1..3}; do
            echo "Smoke test attempt ${attempt}/3"

            HTTP_STATUS=$(curl \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 55 \
              --output response.html \
              --write-out "%{http_code}" \
              "https://${FQDN}/") || HTTP_STATUS="000"

            if [ "$HTTP_STATUS" = "200" ] &&
              grep -Eq 'class="album-title">[^<]+</span>' response.html; then
              echo "Smoke test passed!"
              echo "Frontend successfully rendered album data."
              exit 0
            fi

            echo "Attempt failed. HTTP status: ${HTTP_STATUS}"

            if [ "$attempt" -lt 3 ]; then
              echo "Waiting 5 seconds before retrying..."
              sleep 5
            fi
          done

          echo "Smoke test failed: no successful album page was rendered."
          exit 1